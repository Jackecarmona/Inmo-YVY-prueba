<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#111820">
<title>Ingresar · YVY Capital</title>
<meta name="robots" content="noindex">
<script>document.documentElement.classList.add("js");try{var c=JSON.parse(localStorage.getItem("yvy_consentimiento"));if(!c||c.v!==1||Date.now()-new Date(c.fecha)>3.2e10)throw 0}catch(e){document.documentElement.classList.add("con-galletas")}</script>
<link rel="preload" href="../assets/fuentes/montserrat.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fuentes/manrope.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body data-base="../" data-pagina="ingresar">

<main>
  <section class="wrap cl-acceso">
    <div>
      <h1 class="h-seccion">Ingresar</h1>
    </div>

    <!-- Solo para el equipo: los clientes dejan sus datos en el formulario, el simulador o el chat
         y aparecen como consultas en el panel. Las contraseñas se gestionan desde Supabase. -->
    <div class="form">
      <form class="cl-form" id="form-entrar" novalidate>
        <div class="campo"><label for="e-email">Email</label><input type="email" id="e-email" autocomplete="username"></div>
        <div class="campo"><label for="e-pass">Contraseña</label><input type="password" id="e-pass" autocomplete="current-password"></div>
        <p class="error" id="e-error" role="alert"></p>
        <button class="btn btn--oro" type="submit" id="btn-entrar">Ingresar</button>
      </form>
    </div>
  </section>
</main>

<script src="../js/consentimiento.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/config.js"></script>
<script src="../js/moneda.js"></script>
<script src="../js/db.js"></script>
<script src="../js/scoring.js"></script>
<script src="../js/app.js"></script>
<script src="ingresar.js"></script>
</body>
</html>
